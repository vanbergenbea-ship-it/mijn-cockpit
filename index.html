/* Ochtendroutine: behoud van de eigen vertrouwde routines en historie. */
.routine-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
.routine-day{position:relative;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:11px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:13px;min-width:0}
.routine-day b{font-size:17px}.routine-day small{font-size:11px;color:var(--muted)}
.routine-day.selected{border-color:var(--green);background:#e5f6ee;color:#096648}
.routine-day .checkdot{position:absolute;right:4px;top:3px;color:var(--green);font-size:11px}
.routine-day:disabled{opacity:.4;cursor:default}
.morning-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.morning-tile{border:1px solid var(--line);border-radius:16px;background:var(--surface2);position:relative;min-width:0}
.morning-tile.done{background:linear-gradient(135deg,#087b60,#09644f);color:white;border-color:#08684c}
.morning-tap{background:none;color:inherit;border:none;text-align:left;display:flex;align-items:flex-start;flex-direction:column;padding:16px;gap:8px;width:100%;min-height:148px}
.morning-tap strong{font-size:13px;line-height:1.3;padding-right:18px}
.morning-tap>span:last-child{font-size:10px;opacity:.75}
.morning-ico{border-radius:12px;background:rgba(7,123,88,.10);height:37px;width:37px;display:grid;place-items:center;color:var(--green)}
.morning-tile.done .morning-ico{background:#ffffff27;color:#fff}
.morning-edit{position:absolute;top:10px;right:9px}.morning-tile.done .morning-edit{color:#fff}
.routine-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:22px}
.routine-stats>div{display:flex;flex-direction:column;padding:14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.routine-stats strong{font-size:23px;line-height:1.1}.routine-stats span{font-size:11px;color:var(--muted);margin-top:4px}
.dark .routine-day.selected{background:#173b31;color:#91e9c6}
@media(max-width:560px){.routine-days{gap:4px}.routine-day{padding:10px 0}.routine-day b{font-size:15px}.morning-tiles{gap:9px}.morning-tap{min-height:138px;padding:12px}.morning-tap strong{font-size:12px}}

/* Weekplanner: taken per weekdag zonder datumkeuze. */
.week-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;align-items:start}
.week-column{padding:0!important;overflow:hidden;min-height:218px;transition:border-color .15s,box-shadow .15s}
.week-column.is-today{border:2px solid var(--primary)}
.week-column.drop-target{border-color:var(--green);box-shadow:0 0 0 3px rgba(25,168,122,.13)}
.week-column-head{display:flex;align-items:center;justify-content:space-between;padding:19px 18px;border-bottom:1px solid var(--line);gap:10px}
.week-overline{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.week-column.is-today .week-overline{color:var(--primary)}
.week-column-head h2{font-size:19px;margin:2px 0 0;font-weight:800}
.week-pending{color:var(--muted);font-size:11px}
.week-column-head .day-add{flex:none;border-radius:12px}
.week-card-tasks{padding:7px 12px 13px}
.week-column .task-row{padding:12px 2px;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.week-column .task-row:last-child{border-bottom:0}
.week-column .task-body{flex:1;min-width:0;width:calc(100% - 50px)}
.week-column .move-select{margin-left:27px;max-width:calc(100% - 70px);width:160px;padding:7px 5px;font-size:11px;min-width:0}
.week-column .row-action{margin-left:auto}
.week-empty{color:var(--muted);padding:20px 12px 25px;font-size:12px;text-align:center}
.week-task.dragging{opacity:.5}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.day-chip-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
.day-chip{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:11px 5px;display:flex;flex-direction:column;gap:5px;align-items:center;color:var(--ink)}
.day-chip strong{font-size:11px;overflow-wrap:normal;white-space:nowrap}.day-chip span{font-size:21px;font-weight:850}
.day-chip.active{border-color:var(--primary);background:var(--primarySoft);color:var(--primary)}
.move-select{font-weight:650;font-size:12px;max-width:160px}
.field[hidden],#task-weekday-field[hidden]{display:none!important}
@media(max-width:1350px){.week-board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:850px){.week-board{grid-template-columns:repeat(2,minmax(0,1fr))}.day-chip-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:620px){.week-board{grid-template-columns:1fr}.day-chip-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.day-chip{padding:11px 8px}.day-chip strong{font-size:12px}.day-chip span{font-size:19px}.week-column-head{padding:14px 15px}.week-card-tasks{padding:6px 13px}.week-column .move-select{max-width:calc(100% - 66px);width:185px}}

const ico=(n,cl='')=>`<svg class="icon ${cl}" viewBox="0 0 24 24" aria-hidden="true">${iconSvg[n]||iconSvg.info}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// De oorspronkelijke ochtendapp bewaart haar gegevens onder deze sleutel.

const MORNING_ICONS=['sun','droplet','coffee','dumbbell','wind','pill','calendar','book','heart','sparkles'];
const FIRST_MORNING=[
 {id:'water',title:'Water of thee drinken',icon:'droplet'},
 {id:'ontbijt',title:'Rustig ontbijten',icon:'coffee'},
 {id:'bewegen',title:'7 minuten bewegen',icon:'dumbbell'},
 {id:'ademen',title:'Ademhaling',icon:'wind'},
 {id:'vitamines',title:'Vitaminen nemen',icon:'pill'},
 {id:'plannen',title:'Mijn dag plannen',icon:'calendar'}
];
function originalMorning(){
 try{
  const v=JSON.parse(localStorage.getItem(MORNING_KEY));
  if(!v||!Array.isArray(v.tasks)||!v.tasks.length||!v.done||typeof v.done!=='object')return null;

   startedOn:/^\d{4}-\d\d-\d\d$/.test(v.startedOn)?v.startedOn:dateKey(),
   tasks:v.tasks.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string').slice(0,20)

  };
 }catch{return null}

 data.routineStartedOn=legacyMorning.startedOn;

function render(){document.getElementById('app').innerHTML=shell();applyTheme()}
function head(eyebrow,title,sub,button=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p></div>${button}</div>`}
function stat(label,num,sub,icon){return `<div class="stat"><span class="stat-label">${label}</span><div class="stat-ico">${ico(icon)}</div><div class="stat-num">${num}</div><div class="stat-sub">${sub}</div></div>`}
function empty(icon,title,txt,action,label){return `<div class="empty"><div class="empty-ico">${ico(icon)}</div><strong>${title}</strong><p>${txt}</p>${action?`<button class="btn sm" data-action="${action}">${ico('plus')}${label}</button>`:''}</div>`}
function taskRow(t){
 const list=taskList(t),day=normalizedDay(t);
 const moveOptions=[...WEEKDAYS.map((label,i)=>`<option value="dag:${i}" ${list==='dag'&&day===i?'selected':''}>${label}</option>`),
   `<option value="prive" ${list==='prive'?'selected':''}>Privé</option>`,
   `<option value="later" ${list==='later'?'selected':''}>Voor later</option>`].join('');
 return `<div class="task-row week-task ${t.completed?'task-complete':''}" draggable="${!t.completed&&list==='dag'}" data-taskdrag="${esc(t.id)}">
  <button class="check ${t.completed?'done':''}" data-action="toggle-task" data-id="${esc(t.id)}" title="${t.completed?'Opnieuw openen':'Afronden'}" aria-label="${t.completed?'Heropen':'Voltooi'}: ${esc(t.title)}">${t.completed?ico('checkmark'):''}</button>
  <div class="task-body"><div class="task-name ${t.completed?'done':''}">${esc(t.title)}</div><div class="task-meta"><span class="pill ${esc(t.category)}">${esc(cat(t.category).name)}</span>${t.priority==='high'?'<span class="priority-mark" title="Hoge prioriteit"></span>':''}</div></div>
  <label class="visually-hidden" for="move-${esc(t.id)}">Verplaats ${esc(t.title)} naar</label>
  <select class="control move-select" id="move-${esc(t.id)}" data-move-task="${esc(t.id)}" title="Verplaats naar een andere dag of lijst" aria-label="Verplaats ${esc(t.title)} naar">${moveOptions}</select>
  <button class="row-action" data-action="edit-task" data-id="${esc(t.id)}" aria-label="Bewerk taak">${ico('pencil')}</button>
 </div>`
}

 const boardSummary=WEEKDAYS.map((name,i)=>`<button class="day-chip ${i===d?'active':''}" data-action="open-weekday" data-day="${i}"><strong>${name}</strong><span>${taskCount('dag',i)}</span></button>`).join('');
 return `${head('Jouw persoonlijke startpunt',greet+'.','Dit is jouw overzicht voor '+WEEKDAYS[d].toLowerCase()+'.')}

 <section class="card week-shortcut"><div class="card-head"><h2 class="card-title">${ico('check')} Mijn week in één oogopslag</h2><button class="link-btn" data-action="nav" data-view="taken">Open weekplanner →</button></div><div class="day-chip-grid">${boardSummary}</div></section>
 <div class="content-grid"><div class="stack">

 <section class="card"><div class="card-head"><h2 class="card-title">${ico('check')} Mijn taken op ${WEEKDAYS[d].toLowerCase()}</h2><button class="link-btn" data-action="new-task-day" data-day="${d}">+ Nieuwe taak</button></div>${todayTasks.length?`<div class="section-list">${todayTasks.map(taskRow).join('')}</div>`:empty('check','Nog geen dagtaken','Voeg een taak toe voor '+WEEKDAYS[d].toLowerCase()+'.','new-task','Taak toevoegen')}</section>
 </div><div class="stack">
 <section class="card"><div class="card-head"><h2 class="card-title">${ico('sun')} Mijn ochtendroutine</h2><button class="link-btn" data-action="nav" data-view="routines">Beheren →</button></div><div class="habit-overview"><div class="circle-progress" style="--val:${habitPercent()}%"><strong>${habitPercent()}%</strong></div><div class="habit-checks">${data.habits.slice(0,6).map(h=>`<div class="habit-line"><input class="habit-check" type="checkbox" id="dash-h-${esc(h.id)}" data-habit="${esc(h.id)}" ${habitDone(h.id)?'checked':''}><label for="dash-h-${esc(h.id)}">${esc(h.title)}</label></div>`).join('')||'<p class="small-muted">Nog geen routines.</p>'}</div></div><div class="row-line" style="margin-top:18px;gap:8px;flex-wrap:wrap"><span class="pill">🔥 ${morningStreak()} dagen reeks</span><span class="pill">✦ ${morningPoints()} punten</span><button class="link-btn" data-action="nav" data-view="routines">Open ochtendroutine →</button></div></section>
 <section class="card"><div class="card-head"><h2 class="card-title">${ico('building')} Mijn domeinen</h2><span class="card-caption">Openstaande taken</span></div><div class="domain-grid">${CATS.map(c=>`<div class="domain"><div class="domain-icon">${ico(c.icon)}</div><div style="flex:1;min-width:0"><strong>${c.name}</strong><small>Te doen</small></div><div class="domain-count">${openTasks().filter(t=>t.category===c.id).length}</div></div>`).join('')}</div></section>
 <section class="card"><div class="card-head"><h2 class="card-title">${ico('clock')} Voor later</h2></div><p class="small-muted" style="margin:0 0 12px">${taskCount('later')} taken geparkeerd voor later.</p><button class="btn" data-action="open-list" data-list="later" style="width:100%">Bekijk de lijst →</button></section>

function taskResults(){
 const allowed=t=>(ui.taskFilter==='all'||(ui.taskFilter==='open'?!t.completed:t.completed))&&
 (ui.taskCat==='alle'||t.category===ui.taskCat)&&
 (!ui.taskSearch||[t.title,t.notes,cat(t.category).name].join(' ').toLowerCase().includes(ui.taskSearch.toLowerCase()));
 if(ui.taskList==='dag'){
  const today=weekdayToday();
  return `<div class="week-board">${WEEKDAYS.map((day,i)=>{
   const todos=sortTasks(data.tasks.filter(t=>inList(t,'dag',i)&&allowed(t)));
   const pending=taskCount('dag',i);
   return `<section class="card week-column ${i===today?'is-today':''}" data-drop-day="${i}" aria-label="Taken voor ${day}">
    <div class="week-column-head"><div><span class="week-overline">${i===today?'VANDAAG':'WEEKPLANNING'}</span><h2>${day}</h2><span class="week-pending">${pending} openstaand</span></div>
    <button class="btn icon-only day-add" data-action="new-task-day" data-day="${i}" title="Taak op ${day} toevoegen" aria-label="Taak voor ${day} toevoegen">${ico('plus')}</button></div>
    <div class="week-card-tasks">${todos.map(taskRow).join('')||`<div class="week-empty">Geen taken ${ui.taskFilter==='done'?'afgerond':'gepland'}.</div>`}</div>
   </section>`
  }).join('')}</div>`
 }
 const items=sortTasks(data.tasks).filter(t=>taskList(t)===ui.taskList&&allowed(t));
 return items.length?`<div class="card tasks-panel">${items.map(taskRow).join('')}</div>`:
  empty('check','Deze lijst is leeg','Voeg een taak toe om te beginnen.','new-task','Nieuwe taak');
}
function renderTasks(){
 const tabs=[['dag','Weekplanner',ico('check')],['prive','Privé',ico('heart')],['later','Voor later',ico('clock')]];
 const curr=ui.taskList;
 return `${head('Een overzicht zonder datums','Mijn to-do-lijsten','Plan je taken op maandag, dinsdag, woensdag enzovoort. Schuif een taak gewoon door naar een andere dag.',`<button class="btn primary" data-action="new-task">${ico('plus')} Taak toevoegen</button>`)}
 <div class="list-tabs">${tabs.map(([id,label,icon])=>`<button class="list-tab ${curr===id?'selected':''}" data-action="task-list" data-list="${id}">${icon}<span>${label}</span><span class="list-count">${curr==='dag'?openTasks().filter(t=>taskList(t)==='dag').length:taskCount(id)}</span></button>`).join('')}</div>
 <div class="filterbar" style="margin-top:18px"><div class="tabs">${[['open','Openstaand'],['all','Alles'],['done','Afgerond']].map(([id,l])=>`<button class="tab ${ui.taskFilter===id?'active':''}" data-action="filter-tasks" data-filter="${id}">${l}</button>`).join('')}</div>
 <select class="control" id="task-cat" aria-label="Filter op domein"><option value="alle">Alle domeinen</option>${CATS.map(c=>`<option value="${c.id}" ${ui.taskCat===c.id?'selected':''}>${c.name}</option>`).join('')}</select>
 <div class="searchwrap">${ico('search')}<input id="task-search" placeholder="Zoek een taak..." aria-label="Zoek taken" value="${esc(ui.taskSearch)}"></div></div>
 <div id="task-results">${taskResults()}</div>
 <div class="notice" style="margin-top:16px">${ico('info')}<p>${curr==='dag'?'Je kunt op een computer een taak naar een andere dag slepen. Op je gsm gebruik je het keuzemenu bij een taak om ze naar dinsdag, woensdag of een andere lijst te verplaatsen.':'Kies bij een taak een weekdag om ze meteen in te plannen. Je kunt ze ook naar Privé of Voor later schuiven.'}</p></div>`;
}

function renderRoutines(){
 const day=ui.routineDay||dateKey();
 const isFuture=day>dateKey();
 const percent=habitPercent(day);
 const done=data.habits.filter(h=>habitDone(h.id,day)).length;
 const weekday=['Zo','Ma','Di','Wo','Do','Vr','Za'];
 const weekStart=shift(day,-((parseDate(day).getDay()+6)%7));
 const dateButtons=Array.from({length:7},(_,i)=>{
  const date=shift(weekStart,i),checked=habitPercent(date)===100;
  return `<button class="routine-day ${date===day?'selected':''}" data-action="routine-day" data-day="${date}" ${date>dateKey()?'disabled':''}>
   <small>${['Ma','Di','Wo','Do','Vr','Za','Zo'][i]}</small>
   <b>${parseDate(date).getDate()}</b>${checked?'<span class="checkdot">✓</span>':''}</button>`
 }).join('');
 return `${head('Jouw vertrouwde ochtendapp','Mijn ochtendroutine','Dezelfde taken, je punten en je afvinkgeschiedenis — nu geïntegreerd in de cockpit.',`<button class="btn primary" data-action="new-habit">${ico('plus')} Routine toevoegen</button>`)}
 <section class="card routine-week-card">
  <div class="card-head"><h2 class="card-title">${ico('calendar')} Weekoverzicht</h2><div class="row-line" style="gap:7px"><button class="btn sm" data-action="routine-prev">‹</button><button class="btn sm" data-action="routine-today">Vandaag</button><button class="btn sm" data-action="routine-next" ${shift(day,7)>dateKey()?'disabled':''}>›</button></div></div>
  <div class="routine-days">${dateButtons}</div>
 </section>
 <div class="content-grid"><div class="stack">
  <section class="card"><div class="card-head"><h2 class="card-title">${ico('sun')} ${day===dateKey()?'Vandaag':fd(day,{weekday:'long',day:'numeric',month:'long'})}</h2><span class="pill">${done} van ${data.habits.length} klaar</span></div>
  <div class="morning-tiles">${data.habits.map(h=>{
  const completed=habitDone(h.id,day);
  return `<div class="morning-tile ${completed?'done':''}"><button type="button" data-action="routine-check" data-id="${esc(h.id)}" aria-pressed="${completed}" ${isFuture?'disabled':''} class="morning-tap"><span class="morning-ico">${ico(h.icon==='droplet'?'activity':h.icon==='dumbbell'?'activity':h.icon==='wind'?'sun':h.icon==='pill'?'heart':h.icon==='calendar'?'calendar':h.icon==='coffee'?'coffee':h.icon==='book'?'note':h.icon==='heart'?'heart':'sun')}</span><strong>${esc(h.title)}</strong><span>${completed?'✓ Afgewerkt':'Tik om af te vinken'}</span></button><button type="button" class="row-action morning-edit" data-action="edit-habit" data-id="${esc(h.id)}" aria-label="Routine aanpassen">${ico('pencil')}</button></div>`
  }).join('')}</div>
  ${data.habits.length===0?empty('sun','Nog geen ochtendtaken','Voeg je eerste routine toe.','new-habit','Routine toevoegen'):''}
  </section>
 </div>
 <div class="stack">
  <section class="card"><div class="card-head"><h2 class="card-title">${ico('activity')} Jouw voortgang</h2></div>
   <div class="habit-overview"><div class="circle-progress" style="--val:${percent}%"><strong>${percent}%</strong></div><div><strong style="font-size:20px">${done}/${data.habits.length}</strong><p class="small-muted" style="margin:4px 0">afgevinkt op ${fd(day,{day:'numeric',month:'long'})}</p></div></div>
   <div class="routine-stats"><div><strong>${morningStreak()}</strong><span>dagen reeks</span></div><div><strong>${morningPoints()}</strong><span>punten verdiend</span></div></div>
   <div style="margin-top:22px;font-weight:750;font-size:12px">Afgelopen 7 dagen</div><div class="week-bars">${Array.from({length:7},(_,i)=>{const k=shift(dateKey(),i-6),dt=parseDate(k),p=habitPercent(k);return `<div class="week-bar"><div class="week-track" title="${fd(k)}: ${p}%"><span style="height:${p}%"></span></div><div class="week-label">${weekday[dt.getDay()]}</div></div>`}).join('')}</div>
  </section>
  <section class="card"><div class="card-head"><h2 class="card-title">${ico('sun')} Je oorspronkelijke app</h2></div><p class="small-muted" style="margin-bottom:12px">Ook de oorspronkelijke ochtendapp blijft beschikbaar met haar eigen uitgebreide weekweergave en instellingen.</p><div class="row-line" style="gap:10px;flex-wrap:wrap"><a class="btn" href="./ochtendroutine.html">Open oorspronkelijke ochtendapp ↗</a><button class="btn" data-action="morning-import">${ico('upload')} Ochtendroutine-back-up inladen</button></div></section>
 </div></div>`;
}
function noteResults(){let list=[...data.notes].filter(n=>[n.title,n.body,cat(n.category).name].join(' ').toLowerCase().includes(ui.noteSearch.toLowerCase())).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));return list.length?`<div class="notes-grid">${list.map(n=>`<button class="note-card" data-action="edit-note" data-id="${esc(n.id)}"><span class="pill ${esc(n.category)}" style="align-self:flex-start">${esc(cat(n.category).name)}</span><div class="note-card-title">${esc(n.title)}</div><div class="note-preview">${esc(n.body||'Geen inhoud')}</div><div class="note-date">${new Intl.DateTimeFormat('nl-BE',{day:'numeric',month:'short',year:'numeric'}).format(new Date(n.updatedAt||Date.now()))}</div></button>`).join('')}</div>`:empty('note','Nog geen notities','Bewaar ideeën, afspraken of gedachten op één plek.','new-note','Notitie toevoegen')}
function renderNotes(){return `${head('Ideeën en gedachten','Mijn notities','Leg vast wat je wilt onthouden.',`<button class="btn primary" data-action="new-note">${ico('plus')} Notitie maken</button>`)}<div class="filterbar"><div class="searchwrap" style="max-width:360px;width:100%">${ico('search')}<input id="note-search" placeholder="Zoeken in mijn notities..." aria-label="Zoek notities" value="${esc(ui.noteSearch)}"></div></div><div id="notes-results">${noteResults()}</div>`}
function renderSettings(){return `${head('Jouw cockpit, jouw regels','Instellingen','Pas de weergave aan en beheer je gegevens.')}<section class="card" style="max-width:840px"><div class="card-head"><h2 class="card-title">${ico('sun')} Weergave</h2></div><div class="setting-row"><div><strong>Kleurenthema</strong><small>Kies een lichte of donkere omgeving.</small></div><div class="swatches"><button class="swatch ${data.theme!=='dark'?'selected':''}" data-action="theme" data-theme="light">Licht</button><button class="swatch ${data.theme==='dark'?'selected':''}" data-action="theme" data-theme="dark">Donker</button></div></div><div class="setting-row"><div><strong>Back-up downloaden</strong><small>Bewaar je weektaken, privétaken, ochtendroutine en notities als JSON-bestand.</small></div><button class="btn" data-action="export">${ico('download')} Exporteren</button></div><div class="setting-row"><div><strong>Back-up herstellen</strong><small>Importeer een eerder geëxporteerd bestand. De huidige inhoud wordt vervangen.</small></div><button class="btn" data-action="import">${ico('upload')} Importeren</button></div><div class="setting-row"><div><strong>Alle gegevens wissen</strong><small>Verwijdert alles in je cockpit en ochtendroutine op dit toestel.</small></div><button class="btn danger" data-action="reset">${ico('trash')} Wissen</button></div></section><div class="notice" style="max-width:840px;margin-top:16px">${ico('info')}<p><strong>Privacy en bewaren:</strong> je gegevens worden in je persoonlijke Supabase-account opgeslagen en tussen je toestellen gesynchroniseerd. Voor vertrouwelijke organisatiegegevens is een beveiligd systeem geschikter. Wis je je browsergegevens, dan kunnen je notities verloren gaan: exporteer dus geregeld een back-up.</p></div>`}
function renderView(){switch(ui.view){case 'taken':return renderTasks();case 'routines':return renderRoutines();case 'notities':return renderNotes();case 'instellingen':return renderSettings();default:return renderDashboard()}}
const selectOptions=sel=>CATS.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${c.name}</option>`).join('');
function modal(title,body){const m=document.getElementById('modal-root');m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div id="modal-title" class="modal-title">${title}</div><button class="btn icon-only" type="button" data-action="close-modal" aria-label="Sluiten">${ico('close')}</button></div>${body}</div>`;m.classList.add('show');document.body.style.overflow='hidden';setTimeout(()=>m.querySelector('input:not([type=hidden]),textarea')?.focus(),50)}
function closeModal(){const m=document.getElementById('modal-root');m.classList.remove('show');m.innerHTML='';document.body.style.overflow=''}
function taskModal(id){
 const t=data.tasks.find(t=>t.id===id),list=t?taskList(t):ui.taskList,day=t?normalizedDay(t):ui.taskDay;
 modal(t?'Taak bewerken':'Nieuwe taak',`<form id="task-form" data-id="${t?esc(t.id):''}">
 <div class="form-grid"><div class="field full"><label for="task-title">Wat moet er gebeuren? *</label><input id="task-title" name="title" required maxlength="160" placeholder="Bijvoorbeeld: actiepunt opvolgen" value="${esc(t?.title||'')}"></div>
 <div class="field"><label for="task-list">In welke lijst?</label><select id="task-list" name="list"><option value="dag" ${list==='dag'?'selected':''}>Weekplanner</option><option value="prive" ${list==='prive'?'selected':''}>Privé</option><option value="later" ${list==='later'?'selected':''}>Voor later</option></select></div>
 <div class="field" id="task-weekday-field" ${list!=='dag'?'hidden':''}><label for="task-weekday">Op welke dag?</label><select id="task-weekday" name="weekday">${WEEKDAYS.map((name,i)=>`<option value="${i}" ${day===i?'selected':''}>${name}</option>`).join('')}</select></div>
 <div class="field"><label for="task-category">Domein</label><select name="category" id="task-category">${selectOptions(t?.category||(list==='prive'?'prive':'mirho'))}</select></div>

 <div class="field full"><label for="task-notes">Extra informatie (optioneel)</label><textarea id="task-notes" name="notes" placeholder="Details bij deze taak">${esc(t?.notes||'')}</textarea></div></div>
 <div class="form-footer">${t?`<button type="button" class="btn danger" data-action="delete-task" data-id="${esc(t.id)}">${ico('trash')} Verwijderen</button><div class="spacer"></div>`:''}<button class="btn" type="button" data-action="close-modal">Annuleren</button><button class="btn primary" type="submit">${ico('checkmark')} Bewaren</button></div></form>`)
}

function habitModal(id){const h=data.habits.find(h=>h.id===id);modal(h?'Routine bewerken':'Nieuwe routine',`<form id="habit-form" data-id="${h?esc(h.id):''}"><div class="field"><label for="habit-title">Wat wil je dagelijks doen? *</label><input id="habit-title" name="title" maxlength="100" required placeholder="Bijvoorbeeld: 20 minuten wandelen" value="${esc(h?.title||'')}"></div><div class="form-footer">${h?`<button type="button" class="btn danger" data-action="delete-habit" data-id="${esc(h.id)}">${ico('trash')} Verwijderen</button><div class="spacer"></div>`:''}<button type="button" class="btn" data-action="close-modal">Annuleren</button><button type="submit" class="btn primary">${ico('checkmark')} Bewaren</button></div></form>`)}
function noteModal(id){const n=data.notes.find(n=>n.id===id);modal(n?'Notitie bewerken':'Nieuwe notitie',`<form id="note-form" data-id="${n?esc(n.id):''}"><div class="form-grid"><div class="field full"><label for="note-title">Titel *</label><input id="note-title" name="title" maxlength="160" required placeholder="Waar gaat deze notitie over?" value="${esc(n?.title||'')}"></div><div class="field full"><label for="note-category">Domein</label><select id="note-category" name="category">${selectOptions(n?.category||'prive')}</select></div><div class="field full"><label for="note-body">Notitie</label><textarea name="body" id="note-body" style="min-height:190px" placeholder="Schrijf hier je ideeën...">${esc(n?.body||'')}</textarea></div></div><div class="form-footer">${n?`<button type="button" class="btn danger" data-action="delete-note" data-id="${esc(n.id)}">${ico('trash')} Verwijderen</button><div class="spacer"></div>`:''}<button type="button" class="btn" data-action="close-modal">Annuleren</button><button type="submit" class="btn primary">${ico('checkmark')} Bewaren</button></div></form>`)}

function importMorningBackup(file){
 if(!file)return;if(file.size>2e6){toast('Ochtendroutine-back-up is te groot');return}
 const reader=new FileReader();reader.onload=()=>{
  try{
   const x=JSON.parse(String(reader.result));
   if(!x||!Array.isArray(x.tasks)||x.tasks.length<1||x.tasks.length>20||!x.done||typeof x.done!=='object')throw Error('Ongeldig');
   if(!confirm('Je huidige ochtendroutine vervangen door deze back-up? Je dagtaken en privézaken blijven staan.'))return;
   data.habits=x.tasks.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string').map(t=>({id:t.id.slice(0,80),title:t.title.slice(0,65),icon:MORNING_ICONS.includes(t.icon)?t.icon:'sparkles'}));
   data.routineStartedOn=/^\d{4}-\d\d-\d\d$/.test(x.startedOn)?x.startedOn:dateKey();
   data.habitLog={};
   for(const [day,ids] of Object.entries(x.done))if(/^\d{4}-\d\d-\d\d$/.test(day)&&Array.isArray(ids)){
    data.habitLog[day]={};for(const id of ids)data.habitLog[day][id]=true;
   }
   save();render();toast('Ochtendroutine overgenomen');
  }catch{toast('Geen geldig ochtendroutine-back-upbestand')}
 };reader.readAsText(file)
}
function downloadBackup(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download='mijn-cockpit-backup-'+dateKey()+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Back-up gedownload')}
function validateBackup(x){return x&&typeof x==='object'&&Array.isArray(x.tasks)&&Array.isArray(x.events)&&Array.isArray(x.habits)&&Array.isArray(x.notes)&&x.tasks.length<25000&&x.events.length<25000&&x.notes.length<25000&&x.habits.length<500}
function importBackup(file){if(!file)return;if(file.size>8e6){toast('Bestand is te groot');return}const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(String(reader.result));if(!validateBackup(x))throw Error('bad');if(!confirm('Deze back-up vervangt alle huidige gegevens in deze browser. Doorgaan?'))return;data={...defaults(),...x,habitLog:x.habitLog&&typeof x.habitLog==='object'?x.habitLog:{},focusByDate:x.focusByDate&&typeof x.focusByDate==='object'?x.focusByDate:{},theme:x.theme==='dark'?'dark':'light'};save();render();toast('Back-up hersteld')}catch(e){toast('Dit is geen geldige cockpit-back-up')}};reader.readAsText(file)}
 document.addEventListener('click',ev=>{
 if(ev.target.id==='modal-root'){closeModal();return}
 const b=ev.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action,id=b.dataset.id;
 switch(a){
 case 'nav':ui.view=b.dataset.view;render();window.scrollTo({top:0,behavior:'instant'});break;
 case 'open-weekday':ui.view='taken';ui.taskList='dag';ui.taskDay=Number(b.dataset.day);render();document.querySelector(`[data-drop-day="${ui.taskDay}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});break;
 case 'open-list':ui.view='taken';ui.taskList=b.dataset.list;render();break;
 case 'task-list':ui.taskList=b.dataset.list;render();break;
 case 'new-task-day':ui.taskDay=Number(b.dataset.day);ui.taskList='dag';taskModal();break;
 case 'plan-today':{const t=data.tasks.find(x=>x.id===id);if(t){t.list='dag';t.weekday=weekdayToday();save();render();toast('Ingepland voor '+WEEKDAYS[t.weekday])}}break;
 case 'move-later':{const t=data.tasks.find(x=>x.id===id);if(t){t.list='later';save();render();toast('Verplaatst naar Voor later')}}break;
 case 'morning-import':document.getElementById('morning-import-file').click();break;
 case 'new-task':taskModal();break;
 case 'edit-task':taskModal(id);break;
 case 'toggle-task':{const t=data.tasks.find(x=>x.id===id);if(t){t.completed=!t.completed;t.completedAt=t.completed?dateKey():'';save();render()}}break;
 case 'routine-day':ui.routineDay=b.dataset.day;render();break;
 case 'routine-today':ui.routineDay=dateKey();render();break;
 case 'routine-prev':ui.routineDay=shift(ui.routineDay,-7);render();break;
 case 'routine-next':ui.routineDay=shift(ui.routineDay,7);if(ui.routineDay>dateKey())ui.routineDay=dateKey();render();break;
 case 'routine-check':{const day=ui.routineDay;if(day<=dateKey()&&data.habits.some(h=>h.id===id)){
  if(!data.habitLog[day])data.habitLog[day]={};data.habitLog[day][id]=!data.habitLog[day][id];save();render()}}break;
 case 'new-habit':habitModal();break;
 case 'edit-habit':habitModal(id);break;
 case 'new-note':noteModal();break;
 case 'edit-note':noteModal(id);break;
 case 'close-modal':closeModal();break;
 case 'delete-task':if(confirm('Deze taak definitief verwijderen?')){data.tasks=data.tasks.filter(x=>x.id!==id);save();closeModal();render();toast('Taak verwijderd')}break;
 case 'delete-note':if(confirm('Deze notitie definitief verwijderen?')){data.notes=data.notes.filter(x=>x.id!==id);save();closeModal();render();toast('Notitie verwijderd')}break;
 case 'delete-habit':if(confirm('Deze routine definitief verwijderen?')){data.habits=data.habits.filter(x=>x.id!==id);save();closeModal();render();toast('Routine verwijderd')}break;
 case 'save-focus':data.focusByDate[dateKey()]=document.getElementById('focus-today').value.trim();save();toast('Focus bewaard');break;
 case 'filter-tasks':ui.taskFilter=b.dataset.filter;render();break;
 case 'theme':data.theme=b.dataset.theme;save();render();break;
 case 'export':downloadBackup();break;
 case 'import':document.getElementById('import-file').click();break;
 case 'reset':if(confirm('Weet je zeker dat je ALLE gegevens in deze browser wilt wissen? Dit kun je niet ongedaan maken zonder back-up.')){data=defaults();data.habits=FIRST_MORNING.map(x=>({...x}));data.routineStartedOn=dateKey();save();render();toast('Cockpit opnieuw ingesteld')}break;
 default:break
 }
});
 document.addEventListener('change',ev=>{
 const el=ev.target;
 if(el.matches('[data-habit]')){const k=dateKey();if(!data.habitLog[k])data.habitLog[k]={};data.habitLog[k][el.dataset.habit]=el.checked;save();render()}
 else if(el.matches('[data-move-task]')){
  const task=data.tasks.find(x=>x.id===el.dataset.moveTask);if(!task)return;
  if(el.value.startsWith('dag:')){task.list='dag';task.weekday=Number(el.value.split(':')[1])}
  else if(['prive','later'].includes(el.value)){task.list=el.value}
  save();render();toast('Taak verplaatst naar '+(task.list==='dag'?WEEKDAYS[task.weekday]:task.list==='prive'?'Privé':'Voor later'))
 }
 else if(el.id==='task-cat'){ui.taskCat=el.value;document.getElementById('task-results').innerHTML=taskResults()}
 else if(el.id==='import-file'){importBackup(el.files[0]);el.value=''}
 else if(el.id==='morning-import-file'){importMorningBackup(el.files[0]);el.value=''}
 else if(el.id==='task-list'){const day=document.getElementById('task-weekday-field');if(day)day.hidden=el.value!=='dag'}
});
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='task-search'){ui.taskSearch=el.value;document.getElementById('task-results').innerHTML=taskResults()}else if(el.id==='note-search'){ui.noteSearch=el.value;document.getElementById('notes-results').innerHTML=noteResults()}});
 document.addEventListener('submit',ev=>{
 const f=ev.target;if(!f.matches('#task-form,#habit-form,#note-form'))return;
 ev.preventDefault();if(!f.reportValidity())return;
 const v=Object.fromEntries(new FormData(f).entries()),id=f.dataset.id,now=new Date().toISOString();
 if(f.id==='task-form'){
  const existing=data.tasks.find(x=>x.id===id),list=['dag','prive','later'].includes(v.list)?v.list:'later';
  const weekday=Number(v.weekday);
  const obj={title:v.title.trim(),category:v.category,priority:v.priority,notes:v.notes||'',list,
   weekday:weekday>=0&&weekday<=6?weekday:weekdayToday()};
  if(!obj.title)return;
  if(existing)Object.assign(existing,obj);
  else data.tasks.push({id:newId(),...obj,completed:false,completedAt:'',createdAt:now});
  toast(existing?'Taak aangepast':'Taak toegevoegd');
 }else if(f.id==='habit-form'){
  const existing=data.habits.find(x=>x.id===id),obj={title:v.title.trim()};if(!obj.title)return;
  if(existing)Object.assign(existing,obj);else data.habits.push({id:newId(),icon:'sparkles',...obj});
  toast(existing?'Routine aangepast':'Routine toegevoegd');
 }else if(f.id==='note-form'){
  const existing=data.notes.find(x=>x.id===id),obj={title:v.title.trim(),body:v.body||'',category:v.category,updatedAt:now};if(!obj.title)return;
  if(existing)Object.assign(existing,obj);else data.notes.push({id:newId(),...obj,createdAt:now});
  toast(existing?'Notitie aangepast':'Notitie toegevoegd');
 }
 save();closeModal();render();
});
let draggingTaskId=null;
document.addEventListener('dragstart',ev=>{
 const t=ev.target.closest('[data-taskdrag]');if(!t||t.getAttribute('draggable')!=='true')return;
 draggingTaskId=t.dataset.taskdrag;
 if(ev.dataTransfer){ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',draggingTaskId)}
 t.classList.add('dragging');
});
document.addEventListener('dragover',ev=>{
 const col=ev.target.closest('[data-drop-day]');if(!col||!draggingTaskId)return;
 ev.preventDefault();if(ev.dataTransfer)ev.dataTransfer.dropEffect='move';
 col.classList.add('drop-target');
});
document.addEventListener('dragleave',ev=>{
 const col=ev.target.closest('[data-drop-day]');if(col&&!col.contains(ev.relatedTarget))col.classList.remove('drop-target');
});
document.addEventListener('drop',ev=>{
 const col=ev.target.closest('[data-drop-day]');if(!col||!draggingTaskId)return;
 ev.preventDefault();const t=data.tasks.find(x=>x.id===draggingTaskId);
 if(t){t.list='dag';t.weekday=Number(col.dataset.dropDay);save();render();toast('Verplaatst naar '+WEEKDAYS[t.weekday])}
 draggingTaskId=null;
});
document.addEventListener('dragend',()=>{
 draggingTaskId=null;document.querySelectorAll('.drop-target,.dragging').forEach(el=>el.classList.remove('drop-target','dragging'));
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&document.getElementById('modal-root').classList.contains('show'))closeModal()});
window.addEventListener('storage',ev=>{if(ev.key===KEY){data=load();render();toast('Bijgewerkt vanuit ander tabblad')}else if(ev.key===MORNING_KEY){const fresh=originalMorning();if(fresh){data.routineStartedOn=fresh.startedOn;data.habits=fresh.tasks;data.habitLog={};for(const [day,ids] of Object.entries(fresh.done)){data.habitLog[day]={};for(const id of ids)data.habitLog[day][id]=true}render();toast('Ochtendroutine bijgewerkt')}}});
// Synchronisatie: één volledig document per gebruiker. Alleen ophalen wanneer er
// geen lokale wijzigingen wachten; zo worden niet-bevestigde edits niet overschreven.
let cloudClient=null,cloudUser=null,cloudReady=false,cloudDirty=false,cloudBusy=false,cloudTimer=null,cloudLastRemote='';
const cloudGate=document.getElementById('cloud-gate'),cloudMessage=document.getElementById('cloud-message'),cloudStatus=document.getElementById('cloud-status');
function cloudLabel(s){cloudStatus.hidden=false;cloudStatus.textContent=s}
function cloudScheduleSave(){
 if(!cloudReady||!cloudUser)return;
 cloudDirty=true;cloudLabel('☁️ Wijzigingen opslaan…');clearTimeout(cloudTimer);
 cloudTimer=setTimeout(cloudPush,650);
}
async function cloudPush(){
 if(!cloudDirty||cloudBusy||!cloudUser)return;
 cloudBusy=true;cloudDirty=false;
 const snapshot=JSON.stringify(data);
 try{
  const {error}=await cloudClient.from('cockpit_data').upsert({user_id:cloudUser.id,gegevens:JSON.parse(snapshot)},{onConflict:'user_id'});
  if(error)throw error;
  cloudLastRemote=snapshot;cloudLabel('☁️ Opgeslagen');
 }catch(e){cloudDirty=true;cloudLabel('⚠️ Niet online opgeslagen');console.error('Cockpit opslaan:',e)}
 finally{cloudBusy=false;if(cloudDirty){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudPush,2500)}}
}
async function cloudPull(){
 if(!cloudReady||cloudDirty||cloudBusy||!cloudUser||document.hidden)return;
 const {data:row,error}=await cloudClient.from('cockpit_data').select('gegevens').eq('user_id',cloudUser.id).maybeSingle();
 if(error){cloudLabel('⚠️ Synchronisatie niet beschikbaar');return}
 if(row&&row.gegevens){const incoming=JSON.stringify(row.gegevens);if(incoming!==cloudLastRemote){
  cloudLastRemote=incoming;data={...defaults(),...row.gegevens};
  localStorage.setItem(KEY,JSON.stringify(data));saveOriginalMorning();applyTheme();render();cloudLabel('☁️ Bijgewerkt');
 }}
}
async function cloudStart(session){
 cloudUser=session.user;cloudReady=false;cloudGate.hidden=false;cloudMessage.textContent='Gegevens ophalen…';
 const {data:row,error}=await cloudClient.from('cockpit_data').select('gegevens').eq('user_id',cloudUser.id).maybeSingle();
 if(error){cloudMessage.textContent='Databasefout: '+error.message;return}
 if(row&&row.gegevens){data={...defaults(),...row.gegevens};cloudLastRemote=JSON.stringify(row.gegevens);localStorage.setItem(KEY,JSON.stringify(data));saveOriginalMorning()}
 else { // Nieuw account: begin met een lege cockpit, niet met oude browserdata.
  data=defaults();data.habits=FIRST_MORNING.map(x=>({...x}));data.routineStartedOn=dateKey();
  localStorage.setItem(KEY,JSON.stringify(data));saveOriginalMorning();
 }
 cloudReady=true;cloudGate.hidden=true;applyTheme();render();cloudLabel('☁️ Verbonden');
 if(!row)cloudScheduleSave();
}
async function cloudInit(){
 if(!window.supabase){cloudMessage.textContent='Supabase kon niet laden. Controleer je internetverbinding.';return}
 cloudClient=window.supabase.createClient(window.COCKPIT_SUPABASE_URL,window.COCKPIT_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 document.getElementById('cloud-form').addEventListener('submit',async e=>{
  e.preventDefault();cloudMessage.textContent='Aanmelden…';
  const email=document.getElementById('cloud-email').value.trim(),password=document.getElementById('cloud-password').value;
  const {data:result,error}=await cloudClient.auth.signInWithPassword({email,password});
  if(error)cloudMessage.textContent=error.message;else await cloudStart(result.session);
 });
 document.getElementById('cloud-register').addEventListener('click',async()=>{
  const email=document.getElementById('cloud-email').value.trim(),password=document.getElementById('cloud-password').value;
  if(!email||password.length<6){cloudMessage.textContent='Vul een e-mailadres en wachtwoord van minstens 6 tekens in.';return}
  cloudMessage.textContent='Account aanmaken…';
  const {data:result,error}=await cloudClient.auth.signUp({email,password});
  if(error)cloudMessage.textContent=error.message;
  else if(result.session)await cloudStart(result.session);
  else cloudMessage.textContent='Controleer je e-mail om je account te bevestigen. Meld je daarna aan.';
 });
 const {data:result}=await cloudClient.auth.getSession();
 if(result.session)await cloudStart(result.session);
 else cloudMessage.textContent='Maak eerst een account aan of meld je aan.';
 setInterval(cloudPull,12000);
 window.addEventListener('online',()=>{if(cloudDirty)cloudPush();else cloudPull()});
}
cloudInit();
applyTheme();render();if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
